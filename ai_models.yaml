project_name: "rrtos_ai"
output_dir: "generated"
app_name: "mnist_app"

defaults:
  target_arch: "rv32"
  optimization: "size"
  memory_strategy: "static"

toolchain:
  root_env: "IREE_TOOLCHAIN_ROOT"

model_sources:
  root_env: "RRTOS_AI_MODEL_DIR"

models:
  - name: "st_mnist_28"
    file: "third_party/iree/samples/models/mnist.mlir"
