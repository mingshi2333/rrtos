name: research-framework-gates

on:
  push:
    branches: [main, master]
    paths:
      - "docs/research_framework/**"
      - "scripts/research_framework/**"
      - "pixi.toml"
      - ".github/workflows/research-framework-gates.yml"
  pull_request:
    paths:
      - "docs/research_framework/**"
      - "scripts/research_framework/**"
      - "pixi.toml"
      - ".github/workflows/research-framework-gates.yml"
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run research-framework CI gates
        run: |
          python scripts/research_framework/run_ci_gates.py \
            --schema docs/research_framework/05_CANONICAL_SCHEMA_V0.yaml \
            --cases-dir docs/research_framework/examples \
            --workflow-doc docs/research_framework/06_AGENT_WORKFLOW_DRAFT.md \
            --docs-dir docs/research_framework
