name: firmware-supported-matrix

on:
  push:
    branches: [main, master]
    paths:
      - "CMakeLists.txt"
      - "config/**"
      - "kernel/**"
      - "multicore/**"
      - "arch/riscv/**"
      - "tests/kernel/**"
      - "hal/**"
      - "ai/**"
      - "apps/**"
      - "boards/be_u1000/**"
      - "ai_models.yaml"
      - "iree-version.lock"
      - "scripts/ai_codegen.py"
      - "scripts/generate_mnist_validation_samples.py"
      - "scripts/run_mnist_validation.py"
      - "scripts/run_mnist_validation_renode.py"
      - "scripts/compare_mnist_validation_logs.py"
      - "scripts/report_ai_footprint_attribution.sh"
      - "scripts/test_ai_registry.sh"
      - "scripts/validate_supported_ai_path.py"
      - "scripts/validate_config_authority.py"
      - "scripts/validate_smp_config_matrix.sh"
      - "scripts/validate_bsp_seam.py"
      - "scripts/validate_support_contract.py"
      - "scripts/validate_kernel_semantics.py"
      - "scripts/be_u1000/**"
      - "tests/test_report_ai_footprint_attribution.py"
      - "docs/SUPPORTED_MATRIX.md"
      - "README.md"
      - "docs/BE_U1000_RUNTIME_VALIDATION_MATRIX.md"
      - "docs/README.md"
      - "docs/AI_CANONICAL_PATH.md"
      - "docs/switching_guide.md"
      - "zoo/workflow.md"
      - "zoo/README.md"
      - "zoo/scripts/tflite_to_iree_c.sh"
      - "pixi.toml"
      - ".github/workflows/firmware-supported-matrix.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "config/**"
      - "kernel/**"
      - "multicore/**"
      - "arch/riscv/**"
      - "tests/kernel/**"
      - "hal/**"
      - "ai/**"
      - "apps/**"
      - "boards/be_u1000/**"
      - "ai_models.yaml"
      - "iree-version.lock"
      - "scripts/ai_codegen.py"
      - "scripts/generate_mnist_validation_samples.py"
      - "scripts/run_mnist_validation.py"
      - "scripts/run_mnist_validation_renode.py"
      - "scripts/compare_mnist_validation_logs.py"
      - "scripts/report_ai_footprint_attribution.sh"
      - "scripts/test_ai_registry.sh"
      - "scripts/validate_supported_ai_path.py"
      - "scripts/validate_config_authority.py"
      - "scripts/validate_smp_config_matrix.sh"
      - "scripts/validate_bsp_seam.py"
      - "scripts/validate_support_contract.py"
      - "scripts/validate_kernel_semantics.py"
      - "scripts/be_u1000/**"
      - "tests/test_report_ai_footprint_attribution.py"
      - "docs/SUPPORTED_MATRIX.md"
      - "README.md"
      - "docs/BE_U1000_RUNTIME_VALIDATION_MATRIX.md"
      - "docs/README.md"
      - "docs/AI_CANONICAL_PATH.md"
      - "docs/switching_guide.md"
      - "zoo/workflow.md"
      - "zoo/README.md"
      - "zoo/scripts/tflite_to_iree_c.sh"
      - "pixi.toml"
      - ".github/workflows/firmware-supported-matrix.yml"
  workflow_dispatch:

jobs:
  # Blocking CI for supported lanes only. Observation and experimental lanes
  # remain outside this workflow unless promoted in the support registry.
  rv32-supported:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.8

      - name: Install runner dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc gcc-riscv64-unknown-elf

      - name: Validate kernel semantic harness
        run: pixi run validate-kernel-semantics

      - name: Validate canonical AI path
        run: pixi run -e rv32 validate-supported-ai

      - name: Build and runtime-validate supported rv32 targets
        run: pixi run -e rv32 validate-supported-rv32

  be-u1000-supported:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.8

      - name: Install cross toolchain dependency
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Install Renode portable
        run: |
          wget -q https://builds.renode.io/renode-latest.linux-portable.tar.gz
          mkdir -p "$HOME/renode-portable"
          tar xf renode-latest.linux-portable.tar.gz -C "$HOME/renode-portable" --strip-components=1
          echo "$HOME/renode-portable" >> "$GITHUB_PATH"

      - name: Build and validate BE-U1000 lane
        run: pixi run -e be-u1000 validate-supported
